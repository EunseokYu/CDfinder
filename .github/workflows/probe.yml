name: probe
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '[["이름","URL"],...]'
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scanner/probe.js
        env:
          TARGETS: ${{ inputs.targets }}
      - name: 결과를 임시 브랜치에 올림
        run: |
          cd out && git init -q -b probe-out && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
